<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 1</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="container">
    <h2>Compra de Pinturas</h2>

    <!-- Mostrar errores si existen -->
    {% if errores %}
      <div class="alert alert-danger">
        <ul>
          {% for error in errores %}
            <li>{{ error }}</li>
          {% endfor %}
        </ul>
      </div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>Nombre:</label>
        <input type="text" name="nombre" value="{{ form.nombre }}" required>
      </div>
      <div class="form-group">
        <label>Edad:</label>
        <input type="number" name="edad" value="{{ form.edad }}" min="0" required>
      </div>
      <div class="form-group">
        <label>Tarros de pintura:</label>
        <input type="number" name="tarros" value="{{ form.tarros }}" min="1" required>
      </div>
      <button type="submit" class="btn btn-primary">Calcular</button>
      <a href="/" class="btn btn-link">Volver</a>
    </form>
  </div>
</body>
</html>
